<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALEX SYSTEM</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0b0e14; 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #ffffff;
      padding: 16px;
    }

    .gateway-card {
      background-color: #0d1117;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 28px 20px 20px 20px;
      max-width: 340px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .icon-container {
      margin-bottom: 16px;
      display: flex;
      justify-content: center;
    }

    .icon-svg {
      width: 48px;
      height: 48px;
      color: #3fb950;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 16px;
      letter-spacing: -0.5px;
    }

    p.description {
      color: #8b949e;
      font-size: 0.9rem;
      line-height: 1.4;
      margin-bottom: 24px;
      padding: 0 10px; /* Un poco de margen para que el texto respire */
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .btn {
      width: 100%;
      padding: 14px 16px;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 700;
      text-align: center;
      transition: all 0.2s ease;
      background-color: transparent;
      color: #ffffff;
      border: 1px solid #3fb950;
      font-family: inherit;
      outline: none;
      cursor: pointer;
    }

    .btn:hover {
      background-color: rgba(63, 185, 80, 0.1);
      transform: scale(0.98);
    }

    .footer-links {
      display: flex;
      justify-content: center;
      gap: 12px;
      font-size: 0.8rem;
      flex-wrap: wrap;
    }

    .footer-links a {
      color: #8b949e;
      text-decoration: underline;
      text-underline-offset: 3px;
      transition: color 0.2s ease;
    }

    .footer-links a:hover {
      color: #c9d1d9;
    }
  </style>
</head>
<body>

  <div class="gateway-card">
    
    <div class="icon-container">
      <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="12 2 21 7 21 17 12 22 3 17 3 7 12 2"></polygon>
        <line x1="12" y1="11" x2="12" y2="16"></line>
        <line x1="12" y1="8" x2="12.01" y2="8"></line>
      </svg>
    </div>

    <!-- Título actualizado -->
    <h1>ALEX SYSTEM</h1>
    
    <!-- Descripción actualizada -->
    <p class="description">
      Get your ALEX X EXECUTOR key for free and execute scripts.
    </p>

    <div class="button-group">
      <!-- Botón con texto Get Key -->
      <button id="get-key-btn" class="btn" onclick="alert('¡Has obtenido tu Key!')">Get Key</button>
    </div>

    <div class="footer-links">
      <a href="#">Report</a>
      <a href="#">Terms of Service</a>
      <a href="#">Privacy Policy</a>
    </div>

  </div>

</body>
</html>
